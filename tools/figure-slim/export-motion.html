<script type="module">
import * as THREE from 'three';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { buildComponentClip } from '/src/scene3d/ColladaChannels.js';
try {
const q = new URLSearchParams(location.search), FPS = 30;
const text = await (await fetch('/assets/' + (q.get('file') ?? 'Haraldur6-mudra.dae'))).text();
