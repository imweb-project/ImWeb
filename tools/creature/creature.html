<!doctype html><meta charset="utf-8">
<title>Creatures</title>
<!-- Standalone stage-1 creature prototypes (docs/creature-brainstorm-handoff.md).
     Serve the repo root and open /tools/creature/creature.html?c=jelly (or ?c=octopus).
     The creature itself — bones, skin, fur, springs, navigator — is engine.js, shared with ImWeb's
     3D scene (src/scene3d/CreatureObject.js); this page is its test host.
     Per creature: <name>-def.js (movement library + pose maths) and its view (body parts, camera,
     colours): <name>-view.js exporting VIEW, or a block in views.js. Register the name in core.js
     CREATURES. Seam check for all of them: node tools/creature/seam-check.mjs -->
<style>
body{margin:0;background:#141417;color:#d8d6cf;font:13px system-ui,sans-serif;display:grid;grid-template-columns:230px 1fr;height:100vh;overflow:hidden}
#side{padding:12px;overflow:auto;border-right:1px solid #2a2a2e}
#side h3{font-size:11px;font-weight:500;color:#8a8880;margin:14px 0 6px;text-transform:lowercase}
button{background:transparent;color:inherit;border:1px solid #3a3a40;border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}
button.on{border-color:#5dcaa5;color:#5dcaa5}
.seg{display:block;width:100%;text-align:left;margin:3px 0}
.seg small{color:#7a786f;margin-left:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
label{color:#a3a29c}
#main{position:relative;min-height:0}
/* absolute: an in-flow canvas sizes the grid row, which resizes the canvas — it grew without end */
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;top:10px;pointer-events:none;line-height:1.6}
#hud b{font-weight:500;color:#fff;font-size:15px}
#stats{position:absolute;right:12px;top:10px;color:#8a8880;text-align:right;font-variant-numeric:tabular-nums;pointer-events:none}
#bar{position:absolute;left:12px;right:12px;bottom:10px;height:3px;background:#2a2a2e}
#bar i{display:block;height:100%;background:#5dcaa5;width:0}
</style>
<div id="side">
  <div class="row" id="creatures"></div>
  <div class="row"><button id="mPlay" class="on">Play whole</button><button id="mLoop">Loop one</button></div>
  <div class="row"><label>Loops each</label><select id="per"><option>1</option><option selected>2</option><option>4</option></select>
    <label>Speed</label><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" style="width:70px"></div>
  <div class="row"><label>Skin</label><select id="skin"><option value="soft">Soft</option><option value="chrome">Chrome</option><option value="glass">Glassy</option></select>
    <label><input type="checkbox" id="bones"> Bones</label>
    <label title="joints chase the pose: weight and follow-through"><input type="checkbox" id="springs" checked> Springs</label></div>
  <div id="list"></div>
</div>
<div id="main"><canvas id="c"></canvas>
  <div id="hud"><b id="hName"></b> <span id="hGroup" style="color:#8a8880"></span><br><span id="hDesc"></span><br><span id="hNext" style="color:#7a786f"></span></div>
  <div id="stats"></div><div id="bar"><i id="barI"></i></div></div>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { CREATURES, VIEW_FOV } from './core.js';
import { createCreature } from './engine.js';
import { VIEWS } from './views.js';

// This page is one HOST of the creature engine (engine.js); ImWeb's 3D scene is the other
// (src/scene3d/CreatureObject.js). The engine builds and moves the creature — bones, skin, fur,
// springs, the walk through its movement library — and is the same code in both, so what is
// judged here is what plays there. The page owns the renderer, camera, lights, floor and buttons.
//
// Every creature is <name>-def.js plus its view: a block in views.js, or its own <name>-view.js
// exporting VIEW (preferred for new creatures — one session per file, no shared edits).
// The list is core.js CREATURES; a creature whose files do not exist yet gets no button.
// Which creatures exist: Vite's import.meta.glob lists the files, and Vite keeps the list current
// when a file is added (a template import(`./${k}-def.js`) or new URL(…, import.meta.url) is frozen
// at transform time instead, and probing for missing files fills every console with 404s).
const DEF_FILES = import.meta.glob('./*-def.js'), VIEW_FILES = import.meta.glob('./*-view.js');
const loadView = async k => VIEWS[k] ?? (await VIEW_FILES[`./${k}-view.js`]()).VIEW;
const label = {};
const ready = (await Promise.all(CREATURES.filter(k => DEF_FILES[`./${k}-def.js`] && (VIEWS[k] || VIEW_FILES[`./${k}-view.js`]))
  .map(k => Promise.all([DEF_FILES[`./${k}-def.js`](), loadView(k)]).then(([d]) => { label[k] = d.NAME; return k; },
    e => { console.error(`creature "${k}" does not load: ${e.message}`); return null; })))).filter(Boolean);
const asked = new URLSearchParams(location.search).get('c');
const which = ready.includes(asked) ? asked : ready[0];
const def = await DEF_FILES[`./${which}-def.js`]();
const view = await loadView(which);
const T = def.LOOP_SECONDS;
const $ = id => document.getElementById(id);
for (const k of ready) {
  const b = document.createElement('button'); b.textContent = label[k] ?? k;
  if (k === which) b.className = 'on';
  b.onclick = () => { location.search = '?c=' + k; };
  $('creatures').appendChild(b);
}
document.title = `Creature: ${def.NAME}`;

const cv = $('c');
const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
ren.setPixelRatio(Math.min(view.pixelRatio ?? 2, devicePixelRatio || 1));   // a view that fills the screen with costly skin may ask for fewer pixels
ren.setClearColor(view.background ?? 0x141417);   // a view may ask for its own backdrop (the pods: pale grey)
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(VIEW_FOV, 1, 0.1, 100);
cam.position.set(...view.camera.pos);
const orbit = new OrbitControls(cam, cv); orbit.target.set(...view.camera.target); orbit.enableDamping = true; orbit.update();
scene.add(new THREE.HemisphereLight(0xfff1e0, 0x2a3f5f, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(3, 5, 4); scene.add(key);
const rimL = new THREE.DirectionalLight(0xffe2cc, 0.45);   // warm, soft: a cold blue rim read as a streak on the clearcoat
rimL.position.set(-4, -2, -3); scene.add(rimL);
const pm = new THREE.PMREMGenerator(ren); const envTex = pm.fromScene(new RoomEnvironment(), 0.04).texture;

// A floor, for creatures that walk (view.floor): soft-edged ground that catches the key light's
// shadow, so feet visibly plant. pose() can fade it (P.parts.floor), e.g. when gravity goes.
const FLOOR_TILE = 1.5;   // world units per tile of floor grain (see grainTexture)
let floor = null;
if (view.floor) {
  ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
  Object.assign(key.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 0.5, far: 25 });
  key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
  const fc = document.createElement('canvas'); fc.width = fc.height = 256;
  const g2 = fc.getContext('2d'), gr = g2.createRadialGradient(128, 128, 20, 128, 128, 128);
  gr.addColorStop(0, '#fff'); gr.addColorStop(0.55, '#aaa'); gr.addColorStop(1, '#000');
  g2.fillStyle = gr; g2.fillRect(0, 0, 256, 256);
  floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({
    color: view.floor.color ?? 0x4a4038, roughness: 0.95, transparent: true, alphaMap: new THREE.CanvasTexture(fc), depthWrite: false,
    map: grainTexture() }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
}
// Floor grain: soft blotches and grit, tiling, one tile per FLOOR_TILE units. A walker that walks in
// place says how fast the ground should pass under it (P.parts.floorVel = [vx, vz], world units per
// second of its own clock) and only the grain scrolls — the fade, the floor and its shadows stay put
// — so planted feet stand still on the ground instead of skating over it.
function grainTexture() {
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const g = c.getContext('2d'); g.fillStyle = '#b8b8b8'; g.fillRect(0, 0, N, N);
  let sd = 11; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
  const dot = (x, y, r, col) => {           // drawn 9 times round the tile so it wraps seamlessly
    g.fillStyle = col;
    for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) { g.beginPath(); g.arc(x + ox, y + oy, r, 0, Math.PI * 2); g.fill(); }
  };
  for (let i = 0; i < 70; i++) dot(rnd() * N, rnd() * N, 10 + rnd() * 34, `rgba(${rnd() < 0.5 ? '40,40,40' : '255,255,255'},${0.05 + rnd() * 0.08})`);
  for (let i = 0; i < 900; i++) { const v = rnd() < 0.55 ? Math.floor(50 + rnd() * 60) : Math.floor(210 + rnd() * 45); dot(rnd() * N, rnd() * N, 0.8 + rnd() * 2.2, `rgba(${v},${v},${v},${0.35 + rnd() * 0.5})`); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(14 / FLOOR_TILE, 14 / FLOOR_TILE); t.anisotropy = ren.capabilities.getMaxAnisotropy();
  return t;
}

// ---- The creature (engine.js) ---------------------------------------------------------------
// ?fur=<length> in the URL: try a coat on every chain that has none (to preview any creature hairy).
const furLen = +new URLSearchParams(location.search).get('fur');
const creature = createCreature(THREE, def, view, {
  world: scene, envMap: envTex, shadows: !!floor,
  furTry: furLen > 0 ? { len: furLen, dens: 0.75, tip: 0.35 } : null,
});
const { limbs, bones } = creature;
const helper = new THREE.SkeletonHelper(limbs); helper.visible = false; scene.add(helper);
let TRIS = 0;
scene.traverse(o => { if (o.isMesh) { const g = o.geometry; TRIS += (g.index ? g.index.count : g.attributes.position.count) / 3; } });

// ---- Navigator buttons ----------------------------------------------------------------------
// The engine keeps the clock and walks the library (engine.js step); the page only says how:
// Play whole = go on to the next movement after "Loops each" loops; Loop one = stay.
const N = def.SEGMENTS.length;
let mode = 'play';
const segBtns = [];
def.GROUPS.forEach(g => {
  const h = document.createElement('h3'); h.textContent = g; $('list').appendChild(h);
  def.SEGMENTS.forEach((s, i) => { if (s.group !== g) return;
    const b = document.createElement('button'); b.className = 'seg'; b.innerHTML = `${s.name}<small>${i + 1}</small>`;
    b.onclick = () => creature.jump(i); $('list').appendChild(b); segBtns[i] = b; });
});
$('mPlay').onclick = () => { mode = 'play'; ui(); };
$('mLoop').onclick = () => { mode = 'loop'; ui(); };
$('skin').onchange = e => creature.setSkin(e.target.value);
$('bones').onchange = e => { helper.visible = e.target.checked; };
function ui() {
  const seg = creature.seg;
  segBtns.forEach((b, i) => b.classList.toggle('on', i === seg));
  $('mPlay').classList.toggle('on', mode === 'play'); $('mLoop').classList.toggle('on', mode === 'loop');
  const s = def.SEGMENTS[seg]; $('hName').textContent = `${seg + 1}. ${s.name}`; $('hGroup').textContent = s.group; $('hDesc').textContent = s.desc;
  $('hNext').textContent = mode === 'play' ? `next: ${def.SEGMENTS[(seg + 1) % N].name}` : 'looping';
}
creature.onSegment = ui;
ui();

function resize() { const w = cv.clientWidth, h = cv.clientHeight; ren.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(cv); resize();

let last = performance.now(), msAvg = 0, fpsAvg = 60, frames = 0;
function frame(now) {
  // Clamp BOTH ways: the first rAF timestamp can predate the script's performance.now(), which
  // gave a negative dt — harmless for the clock, but it runs the joint springs backwards.
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  const cdt = dt * +$('speed').value;                    // the creature's own clock
  const t0 = performance.now();
  creature.step(cdt, { advance: mode === 'play' ? 'next' : 'off', loops: +$('per').value, springs: $('springs').checked });
  if (floor) {
    const P = creature.P, f = P.parts.floor ?? 1; floor.material.opacity = f; floor.visible = f > 0.01;
    // Scroll the grain by the creature's ground speed. The plane lies with u along world x and v along
    // world −z; a texture offset of +δ moves the pattern by −δ tiles.
    const v = P.parts.floorVel, o = floor.material.map.offset;
    if (v) { o.x = (o.x - v[0] * cdt / FLOOR_TILE) % 1; o.y = (o.y + v[1] * cdt / FLOOR_TILE) % 1; }
  }
  orbit.update();
  ren.render(scene, cam);
  const ms = performance.now() - t0;
  msAvg += (ms - msAvg) * 0.05; fpsAvg += (1 / Math.max(dt, 1e-3) - fpsAvg) * 0.05;
  if (++frames % 15 === 0) $('stats').innerHTML =
    `${fpsAvg.toFixed(0)} fps · ${msAvg.toFixed(2)} ms pose+render<br>${bones.length} bones · ${Math.round(TRIS).toLocaleString()} tris · ${ren.info.render.calls} draws<br>loop ${creature.loopsInSeg + 1} · ${(creature.time % T).toFixed(1)} / ${T} s`;
  $('barI').style.width = `${(creature.time % T) / T * 100}%`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// Debug handle. hook = (P, phase) => …: change the pose from the console before it is applied.
window.__creature = { name: which, jump: creature.jump, limbs, cam, orbit, engine: creature, bones: bones.length, tris: TRIS,
  get seg() { return creature.seg; }, get state() { return creature.state; },
  get hook() { return creature.hook; }, set hook(f) { creature.hook = f; } };
</script>
